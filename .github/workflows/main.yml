name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Lagatar warning se bachne ke liye sirf ek variable kafi hai
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v5

    - name: Set up MemKernel as a module (M-OUT) with specified name
      run: |
        curl -LSs "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" | bash -s M

    - name: Android kernel build
      uses: lemniskett/android-kernel-actions@master
      id: build
      env:
        NAME: Loganysl
      with:
        arch: arm64
        compiler: clang/14
        defconfig: blossom_defconfig
        image: Image.gz

    - name: Locate and Collect Modules
      run: |
        mkdir -p ./compiled_modules
        echo "Searching for built .ko files..."
        find . -type f -name "*.ko" -exec cp {} ./compiled_modules/ \;
        echo "Found modules:"
        ls -la ./compiled_modules/

    - name: Upload Kernel and Module
      uses: actions/upload-artifact@v6
      with:
        name: moduleandkernel
        path: |
          ${{ steps.build.outputs.outfile }}
          ./compiled_modules/*.ko
